# SLF4J Simple Logger Configuration

# Default log level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=warn

# Set Reflections library to ERROR level to suppress INFO messages
org.slf4j.simpleLogger.log.org.reflections=error

# Keep your application logs at a reasonable level
org.slf4j.simpleLogger.log.com.ns=info

# Show date and time in logs
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show log name (logger name)
org.slf4j.simpleLogger.showLogName=true

# Show short log name (just the last component)
org.slf4j.simpleLogger.showShortLogName=false

