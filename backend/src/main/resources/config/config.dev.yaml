environment: dev
port: 8080
logLevel: DEBUG
defaultHost: localhost

hosts:
  localhost:
    documentRoot: "frontend/out"
    routes:
      /hello: HelloWorldHandler
      /api/todos/*: ToDoHandler
      /api/sse: SSEHandler

  a.localhost:
    documentRoot: "static/example"
    routes:
      /: HelloWorldHandler

  docs.localhost:
    documentRoot: "docs/build"
    routes:
      /hello: HelloWorldHandler

  javadoc.localhost:
    documentRoot: "backend/src/main/resources/javadoc"
    routes:
      /hello: HelloWorldHandler